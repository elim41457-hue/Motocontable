<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>MotoContable</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,Arial;background:#f1f5f9;color:#111827}*{box-sizing:border-box}body{margin:0}header{background:#111827;color:white;padding:17px 20px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}small{color:#94a3b8}nav{background:white;display:flex;gap:5px;overflow:auto;padding:9px;position:sticky;top:0;box-shadow:0 2px 8px #0001}button{cursor:pointer;border:0;border-radius:8px;padding:10px 13px;background:#e2e8f0;font-weight:600}button.active,.primary{background:#dc2626;color:white}.danger{background:#fee2e2;color:#991b1b}main{max-width:1300px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}.card,.panel{background:white;border-radius:13px;padding:18px;box-shadow:0 2px 8px #0001;margin-bottom:15px}.card strong{font-size:24px;display:block;margin-top:7px}h2{margin-top:0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;align-items:end}label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}input,select,textarea{border:1px solid #cbd5e1;border-radius:7px;padding:10px;width:100%;font:inherit}textarea{min-height:44px}.wide{grid-column:1/-1}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left;white-space:nowrap}th{background:#f8fafc}.muted{color:#64748b}.tag{border-radius:30px;background:#fef3c7;padding:4px 9px}#toast{position:fixed;bottom:15px;right:15px;background:#111827;color:white;padding:13px;border-radius:8px;display:none;max-width:85vw}@media print{header,nav,.no-print,form{display:none!important}main{padding:0}.panel{box-shadow:none}}
</style></head><body><header><div><h1>🏍️ MotoContable</h1><small>Repuestos • Taller • Administración</small></div><span id="online">●</span></header><nav id="nav"></nav><main id="app"></main><div id="toast"></div><script>
const modules=['Inicio','Repuestos','Ventas','Taller','Clientes','Proveedores','Compras','Créditos','Caja','Reportes','Configuración'];const key='motocontable_v1';const blank=()=>({products:[],clients:[],suppliers:[],purchases:[],sales:[],jobs:[],payments:[],expenses:[],settings:{business:'MotoContable',currency:'C$',low:3},counter:0});let db;try{db=JSON.parse(localStorage.getItem(key))||blank()}catch{db=blank()}for(const [k,v] of Object.entries(blank()))if(!(k in db))db[k]=v;let page='Inicio',cart=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>(db.settings.currency||'C$')+' '+Number(n||0).toLocaleString('es-NI',{minimumFractionDigits:2,maximumFractionDigits:2});const date=()=>new Date().toLocaleDateString('en-CA');const uid=()=>++db.counter;const save=()=>{try{localStorage.setItem(key,JSON.stringify(db));return true}catch(e){alert('No se pudo guardar. Exporte un respaldo y revise el espacio disponible.');return false}};const notify=s=>{let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',3000)};const options=(arr,txt='Seleccione')=>'<option value="">'+txt+'</option>'+arr.map(x=>'<option value="'+x.id+'">'+esc(x.name||x.code||x.id)+'</option>').join('');const field=(name,label,type='text',extra='')=>`<label>${label}<input name="${name}" type="${type}" ${extra}></label>`;const panel=(title,body)=>`<section class="panel"><h2>${title}</h2>${body}</section>`;const table=(heads,rows)=>`<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>'<tr>'+r.map(c=>`<td>${c??''}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${heads.length}" class="muted">Sin registros todavía</td></tr>`}</tbody></table></div>`;const totalSale=s=>Number(s.total||0);const paid=(kind,id)=>db.payments.filter(p=>p.kind===kind&&p.ref===id).reduce((a,p)=>a+Number(p.amount),0);const sum=a=>a.reduce((x,y)=>x+Number(y||0),0);const fmt=d=>esc(d||'');function render(){ $('nav').innerHTML=modules.map(m=>`<button class="${m===page?'active':''}" onclick="go('${m}')">${m}</button>`).join('');$('online').textContent=navigator.onLine?'● Con conexión':'● Sin conexión';$('app').innerHTML=({Inicio:home,Repuestos:products,Ventas:sales,Taller:workshop,Clientes:clients,Proveedores:suppliers,Compras:purchases,Créditos:credits,Caja:cash,Reportes:reports,Configuración:settings})[page]()}function go(p){page=p;render()}function submit(id,fn){const f=$(id);f.addEventListener('submit',e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));try{fn(x)}catch(err){alert(err.message)}})}function need(c,m){if(!c)throw Error(m)}function home(){const salesToday=db.sales.filter(s=>s.date===date()),income=sum(salesToday.map(s=>s.total)),cost=sum(salesToday.map(s=>s.cost)),exp=sum(db.expenses.filter(e=>e.date===date()).map(e=>e.amount));return `<div class="grid">${[['Ventas hoy',money(income)],['Margen bruto ventas',money(income-cost)],['Gastos hoy',money(exp)],['Repuestos',db.products.length],['Bajo inventario',db.products.filter(p=>+p.stock<=+db.settings.low).length],['Órdenes abiertas',db.jobs.filter(j=>j.status!=='Entregada').length],['Por cobrar',money(sum(db.sales.map(s=>Math.max(0,s.total-paid('sale',s.id))))+sum(db.jobs.map(j=>Math.max(0,jobTotal(j)-paid('job',j.id)))))]].map(([a,b])=>`<div class="card"><span class="muted">${a}</span><strong>${b}</strong></div>`).join('')}</div>${panel('Repuestos por reponer',table(['Código','Repuesto','Cantidad'],db.products.filter(p=>+p.stock<=+db.settings.low).map(p=>[esc(p.code),esc(p.name),p.stock])))}${panel('Nota importante','<p>Este programa guarda información en este dispositivo. Exporte respaldos regularmente desde Configuración. No comparta el mismo inventario entre dispositivos hasta instalar la sincronización con servidor.</p>')}`}
function products(){return panel('Registrar repuesto',`<form id="prod">${field('code','Código / SKU','text','required')}${field('name','Descripción','text','required')}${field('brand','Marca')}${field('model','Modelo compatible')}${field('cost','Costo C$','number','min="0" step="0.01" required')}${field('price','Precio C$','number','min="0" step="0.01" required')}${field('stock','Existencia inicial','number','min="0" step="1" required')}${field('min','Mínimo','number','min="0" step="1" value="3"')}<button class="primary">Guardar repuesto</button></form>`)+panel('Inventario <input placeholder="Buscar repuesto..." oninput="filterRows(this.value)" style="max-width:300px">',table(['Código','Nombre','Marca','Modelo','Costo','Precio','Existencia','Acción'],db.products.map(p=>[esc(p.code),esc(p.name),esc(p.brand),esc(p.model),money(p.cost),money(p.price),p.stock,`<button onclick="adjust(${p.id})">Ajustar</button> <button onclick="editProduct(${p.id})">Editar</button>`])))}function filterRows(q){document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q.toLowerCase())?'':'none')}function adjust(id){const p=db.products.find(p=>p.id===id),n=prompt('Nueva existencia para '+p.name,p.stock);if(n===null)return;need(Number.isInteger(+n)&&+n>=0,'Cantidad inválida');p.stock=+n;save();render()}function editProduct(id){const p=db.products.find(p=>p.id===id);let name=prompt('Nombre',p.name);if(name===null)return;need(name.trim(),'Nombre requerido');let price=prompt('Precio',p.price);if(price===null)return;need(+price>=0&&price!=='','Precio inválido');p.name=name.trim();p.price=+price;save();render()}
function sales(){return panel('Nueva venta',`<div class="grid"><label>Repuesto<select id="sellproduct">${options(db.products)}</select></label><label>Cantidad<input type="number" id="sellqty" min="1" value="1"></label><div><button onclick="addCart()" class="primary">Agregar</button></div></div><div id="cart">${cartView()}</div><form id="sale"> <label>Cliente (opcional)<select name="client">${options(db.clients,'Consumidor final')}</select></label><label>Forma de pago<select name="method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Crédito</option></select></label><button class="primary">Registrar venta</button></form>`)+panel('Historial de ventas',table(['N.º','Fecha','Cliente','Total','Pagado','Factura'],[...db.sales].reverse().map(s=>[s.id,s.date,esc(db.clients.find(c=>c.id===s.client)?.name||'Consumidor final'),money(s.total),money(paid('sale',s.id)),`<button onclick="receipt('sale',${s.id})">Ver / imprimir</button>`])))}function cartView(){return table(['Repuesto','Cantidad','Subtotal',''],cart.map((c,i)=>[esc(db.products.find(p=>p.id===c.id)?.name),c.qty,money(c.qty*c.price),`<button onclick="cart.splice(${i},1);render()">Quitar</button>`]))+`<h3>Total: ${money(sum(cart.map(c=>c.qty*c.price)))}</h3>`}function addCart(){const id=+$('sellproduct').value,qty=+$('sellqty').value,p=db.products.find(p=>p.id===id);need(p&&Number.isInteger(qty)&&qty>0,'Seleccione un repuesto y cantidad válida');const prev=cart.find(c=>c.id===id);need((prev?.qty||0)+qty<=p.stock,'Existencia insuficiente');if(prev)prev.qty+=qty;else cart.push({id,qty,price:+p.price,cost:+p.cost});render()}
function workshop(){return panel('Nueva orden de taller',`<form id="job"> <label>Cliente<select name="client" required>${options(db.clients)}</select></label>${field('bike','Moto / marca / modelo','text','required')}${field('plate','Placa')}${field('mechanic','Mecánico')}${field('problem','Diagnóstico / trabajo','text','required')}${field('labor','Mano de obra C$','number','min="0" step="0.01" value="0" required')}<label>Estado<select name="status"><option>Recibida</option><option>En reparación</option><option>Lista</option><option>Entregada</option></select></label><button class="primary">Crear orden</button></form>`)+panel('Órdenes de trabajo',table(['Orden','Fecha','Cliente','Moto','Trabajo','Mecánico','Estado','Total','Acciones'],[...db.jobs].reverse().map(j=>[j.id,j.date,esc(db.clients.find(c=>c.id===j.client)?.name),esc(j.bike),esc(j.problem),esc(j.mechanic),esc(j.status),money(jobTotal(j)),`<button onclick="changeJob(${j.id})">Estado</button> <button onclick="jobPart(${j.id})">Repuesto</button> <button onclick="receipt('job',${j.id})">Orden</button>`])))}const jobTotal=j=>+j.labor+sum((j.parts||[]).map(p=>p.qty*p.price));function changeJob(id){const j=db.jobs.find(j=>j.id===id),s=prompt('Estado: Recibida, En reparación, Lista, Entregada',j.status);if(s===null)return;need(['Recibida','En reparación','Lista','Entregada'].includes(s),'Estado inválido');j.status=s;save();render()}function jobPart(id){const j=db.jobs.find(j=>j.id===id),code=prompt('Código de repuesto a utilizar');if(code===null)return;const p=db.products.find(p=>p.code.toLowerCase()===code.toLowerCase());need(p,'Código no encontrado');const q=+(prompt('Cantidad',1));need(Number.isInteger(q)&&q>0&&q<=p.stock,'Cantidad no disponible');j.parts.push({id:p.id,name:p.name,qty:q,price:+p.price,cost:+p.cost});p.stock-=q;save();render()}
function people(kind,title){let arr=db[kind];return panel('Nuevo '+title,`<form id="person">${field('name','Nombre','text','required')}${field('phone','Teléfono','tel')}${field('address','Dirección')}${field('note','Observaciones')}<button class="primary">Guardar</button></form>`)+panel('Listado',table(['ID','Nombre','Teléfono','Dirección','Observaciones'],arr.map(x=>[x.id,esc(x.name),esc(x.phone),esc(x.address),esc(x.note)])))}function clients(){return people('clients','cliente')}function suppliers(){return people('suppliers','proveedor')}
function purchases(){return panel('Compra / entrada de repuestos',`<form id="purchase"><label>Proveedor<select name="supplier">${options(db.suppliers)}</select></label><label>Repuesto<select name="product" required>${options(db.products)}</select></label>${field('qty','Cantidad','number','min="1" step="1" required')}${field('cost','Costo unitario C$','number','min="0" step="0.01" required')}<button class="primary">Registrar compra</button></form>`)+panel('Compras registradas',table(['Fecha','Proveedor','Repuesto','Cantidad','Costo total'],[...db.purchases].reverse().map(x=>[x.date,esc(db.suppliers.find(p=>p.id===x.supplier)?.name||'Sin proveedor'),esc(db.products.find(p=>p.id===x.product)?.name),x.qty,money(x.qty*x.cost)])))}function credits(){let items=[...db.sales.map(s=>({kind:'sale',id:s.id,date:s.date,client:s.client,total:s.total})),...db.jobs.map(j=>({kind:'job',id:j.id,date:j.date,client:j.client,total:jobTotal(j)}))].filter(x=>x.total-paid(x.kind,x.id)>.009);return panel('Registrar abono',`<form id="pay"><label>Cuenta por cobrar<select name="account" required><option value="">Seleccione</option>${items.map(x=>`<option value="${x.kind}:${x.id}">${x.kind==='sale'?'Venta':'Taller'} #${x.id} — ${esc(db.clients.find(c=>c.id===x.client)?.name||'Cliente')} — ${money(x.total-paid(x.kind,x.id))}</option>`).join('')}</select></label>${field('amount','Abono C$','number','min="0.01" step="0.01" required')}<label>Método<select name="method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></label><button class="primary">Registrar abono</button></form>`)+panel('Saldos pendientes',table(['Tipo','Número','Cliente','Total','Abonado','Saldo'],items.map(x=>[x.kind==='sale'?'Venta':'Taller',x.id,esc(db.clients.find(c=>c.id===x.client)?.name||'Consumidor final'),money(x.total),money(paid(x.kind,x.id)),money(x.total-paid(x.kind,x.id))])))}function cash(){return panel('Registrar gasto',`<form id="expense">${field('description','Concepto','text','required')}${field('amount','Monto C$','number','min="0.01" step="0.01" required')}<label>Medio<select name="method"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></label><button class="primary">Guardar gasto</button></form>`)+panel('Movimientos de caja',table(['Fecha','Tipo','Detalle','Medio','Monto'],[...db.sales.filter(s=>s.method!=='Crédito').map(s=>({date:s.date,type:'Venta',desc:'#'+s.id,method:s.method,amount:s.total})),...db.payments.map(p=>({date:p.date,type:'Abono',desc:p.kind+' #'+p.ref,method:p.method,amount:p.amount})),...db.expenses.map(e=>({date:e.date,type:'Gasto',desc:e.description,method:e.method,amount:-e.amount}))].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>[x.date,x.type,esc(x.desc),esc(x.method),money(x.amount)])))}function reports(){const gross=sum(db.sales.map(s=>s.total))+sum(db.jobs.map(jobTotal)),cost=sum(db.sales.map(s=>s.cost))+sum(db.jobs.flatMap(j=>j.parts.map(p=>p.cost*p.qty))),expenses=sum(db.expenses.map(e=>e.amount)),labor=sum(db.jobs.map(j=>j.labor));return `<div class="grid">${[['Ingresos facturados',money(gross)],['Costo de repuestos vendidos',money(cost)],['Mano de obra facturada',money(labor)],['Gastos registrados',money(expenses)],['Resultado estimado',money(gross-cost-expenses)],['Cuentas por cobrar',money(sum(db.sales.map(s=>Math.max(0,s.total-paid('sale',s.id))))+sum(db.jobs.map(j=>Math.max(0,jobTotal(j)-paid('job',j.id)))))]].map(([a,b])=>`<div class="card">${a}<strong>${b}</strong></div>`).join('')}</div>${panel('Detalle','<p class="muted">Resultado gerencial simplificado, no es un estado financiero contable ni considera impuestos, depreciación o todos los ajustes de inventario.</p><button onclick="exportCSV()">Exportar ventas CSV</button>')}`}
function settings(){return panel('Configuración del negocio',`<form id="settings">${field('business','Nombre comercial','text',`value="${esc(db.settings.business)}" required`)}${field('currency','Símbolo de moneda','text',`value="${esc(db.settings.currency)}" required`)}${field('low','Alerta de existencia mínima','number',`min="0" value="${db.settings.low}"`)}<button class="primary">Guardar configuración</button></form>`)+panel('Respaldos y seguridad',`<p>Los datos se guardan localmente en este navegador. Un borrado del navegador o una falla del equipo puede eliminarlos. Haga respaldos frecuentes.</p><button class="primary" onclick="backup()">Descargar respaldo JSON</button> <label style="margin-top:12px">Restaurar respaldo JSON<input type="file" accept=".json,application/json" onchange="restore(this)"></label><p class="muted">La restauración reemplaza los datos actuales. No hay sincronización automática ni inicio de sesión multiusuario en esta versión.</p>`)}
function download(filename,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){download('motocontable-respaldo-'+date()+'.json',JSON.stringify(db,null,2),'application/json')}async function restore(input){const f=input.files[0];if(!f)return;try{const x=JSON.parse(await f.text());need(Array.isArray(x.products)&&Array.isArray(x.sales)&&Array.isArray(x.jobs)&&x.settings,'Archivo no válido');need(confirm('¿Reemplazar TODOS los datos actuales con este respaldo?'),'Cancelado');db=x;for(const [k,v] of Object.entries(blank()))if(!(k in db))db[k]=v;save();cart=[];render();notify('Respaldo restaurado')}catch(e){alert(e.message)}}function exportCSV(){const cols=['id','date','total','cost','method'];const csv=[cols.join(','),...db.sales.map(s=>cols.map(k=>'"'+String(s[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');download('ventas-motocontable.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
function receipt(kind,id){let x=kind==='sale'?db.sales.find(s=>s.id===id):db.jobs.find(j=>j.id===id);if(!x)return;const customer=db.clients.find(c=>c.id===x.client)?.name||'Consumidor final',items=kind==='sale'?x.items:x.parts;const w=window.open('','_blank');if(!w){alert('Permita ventanas emergentes para imprimir');return}const html=`<!doctype html><html><head><meta charset="utf-8"><title>Comprobante ${id}</title><style>body{font:14px Arial;max-width:480px;margin:25px auto}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ddd;padding:7px;text-align:left}</style></head><body><h2>${esc(db.settings.business)}</h2><p>Comprobante interno ${kind==='sale'?'de venta':'de taller'} #${id}<br>Fecha: ${x.date}<br>Cliente: ${esc(customer)}</p>${kind==='job'?`<p>Moto: ${esc(x.bike)}<br>Trabajo: ${esc(x.problem)}<br>Estado: ${esc(x.status)}</p>`:''}<table><tr><th>Detalle</th><th>Cant.</th><th>Total</th></tr>${items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.qty}</td><td>${money(i.price*i.qty)}</td></tr>`).join('')}${kind==='job'?`<tr><td>Mano de obra</td><td>1</td><td>${money(x.labor)}</td></tr>`:''}</table><h2>Total: ${money(kind==='sale'?x.total:jobTotal(x))}</h2><p>Documento de control interno. No sustituye una factura fiscal autorizada.</p><button onclick="print()">Imprimir</button></body></html>`;w.document.write(html);w.document.close()}
function bind(){const f=$('prod');if(f)submit('prod',x=>{need(!db.products.some(p=>p.code.toLowerCase()===x.code.trim().toLowerCase()),'Código duplicado');need(+x.price>=0&&+x.cost>=0&&Number.isInteger(+x.stock),'Datos inválidos');db.products.push({...x,id:uid(),code:x.code.trim(),cost:+x.cost,price:+x.price,stock:+x.stock,min:+x.min});save();render();notify('Repuesto registrado')});if($('sale'))submit('sale',x=>{need(cart.length,'Agregue repuestos');need(x.method!=='Crédito'||x.client,'Seleccione un cliente para crédito');for(const c of cart)need(db.products.find(p=>p.id===c.id).stock>=c.qty,'Existencia insuficiente');const items=cart.map(c=>({...c,name:db.products.find(p=>p.id===c.id).name}));const total=sum(items.map(c=>c.qty*c.price)),cost=sum(items.map(c=>c.qty*c.cost));for(const c of cart)db.products.find(p=>p.id===c.id).stock-=c.qty;const id=uid();db.sales.push({id,date:date(),client:+x.client||null,method:x.method,items,total,cost});if(x.method!=='Crédito')db.payments.push({id:uid(),kind:'sale',ref:id,date:date(),amount:total,method:x.method});cart=[];save();render();notify('Venta #'+id+' guardada')});if($('job'))submit('job',x=>{db.jobs.push({...x,id:uid(),date:date(),client:+x.client,labor:+x.labor,parts:[]});save();render();notify('Orden creada')});if($('person'))submit('person',x=>{db[page==='Clientes'?'clients':'suppliers'].push({...x,id:uid()});save();render();notify('Guardado')});if($('purchase'))submit('purchase',x=>{const p=db.products.find(p=>p.id===+x.product);need(p&&Number.isInteger(+x.qty)&&+x.qty>0&&+x.cost>=0,'Datos inválidos');p.stock+=+x.qty;p.cost=+x.cost;db.purchases.push({id:uid(),date:date(),supplier:+x.supplier||null,product:p.id,qty:+x.qty,cost:+x.cost});save();render();notify('Compra registrada')});if($('pay'))submit('pay',x=>{const [kind,id]=x.account.split(':'),r=kind==='sale'?db.sales.find(s=>s.id===+id):db.jobs.find(j=>j.id===+id),due=(kind==='sale'?r.total:jobTotal(r))-paid(kind,+id);need(+x.amount>0&&+x.amount<=due+.001,'El abono supera el saldo');db.payments.push({id:uid(),kind,ref:+id,date:date(),amount:+x.amount,method:x.method});save();render();notify('Abono registrado')});if($('expense'))submit('expense',x=>{need(+x.amount>0,'Monto inválido');db.expenses.push({...x,id:uid(),date:date(),amount:+x.amount});save();render();notify('Gasto registrado')});if($('settings'))submit('settings',x=>{db.settings={...x,low:+x.low};save();render();notify('Configuración guardada')})}const originalRender=render;render=function(){originalRender();bind()};render();window.addEventListener('online',render);window.addEventListener('offline',render);if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
